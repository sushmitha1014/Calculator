
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <main class="calculator">
        <h1>Calculator</h1>

        <div class="display">
            <div id="previous"></div>
            <input
                type="text"
                id="result"
                value="0"
                readonly
                aria-label="Calculator display"
            >
        </div>

        <div class="buttons">
            <button class="reset" data-action="clear">AC</button>
            <button class="operator" data-action="delete">⌫</button>
            <button class="operator" data-action="percent">%</button>
            <button class="operator" data-op="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-op="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-op="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-op="+">+</button>

            <button data-action="sign">±</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="equals" data-action="equals">=</button>
        </div>

        <p class="hint">Simple. Fast. Accurate.</p>
    </main>

    <script src="calci.js"></script>
</body>
</html>
